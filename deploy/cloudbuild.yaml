steps:
  # 1. Build the container image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/dispatch-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/dispatch-api:latest'
      - '-f'
      - 'server/Dockerfile'
      - 'server'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/dispatch-api:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/dispatch-api:latest']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dispatch-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/dispatch-api:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # This pipeline is the public demo. Do not set APP_MODE=production here.
      # A production install is a separate Cloud Run service with APP_MODE=production
      # plus private ADMIN_PASSWORD, ADMIN_API_SECRET, APPROVAL_SECRET, and PARENT_JWT_SIGNING_KEY.
      - '--set-env-vars'
      - 'ENV=production,GCP_PROJECT_ID=$PROJECT_ID,APP_MODE=demo'

images:
  - 'gcr.io/$PROJECT_ID/dispatch-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/dispatch-api:latest'
