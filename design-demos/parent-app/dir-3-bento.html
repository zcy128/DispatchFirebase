<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方向 C · Gentler Streak 暖心守护 (Family Bento) - PCY Parent App</title>
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap');
    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif;
      background: #0B101D;
      color: #F8FAFC;
      margin: 0;
      padding: 0;
      overflow-x: auto;
    }
  </style>
</head>
<body class="p-6 md:p-10">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const iosFrameStyles = {
      wrapper: {
        display: 'inline-block',
        padding: '10px',
        background: '#1A2338',
        borderRadius: '52px',
        boxShadow: '0 25px 60px -15px rgba(11, 16, 29, 0.9), 0 0 0 1px rgba(255,255,255,0.15) inset',
        position: 'relative',
        flexShrink: 0,
      },
      screen: {
        width: '360px',
        height: '760px',
        position: 'relative',
        borderRadius: '42px',
        overflow: 'hidden',
        background: '#121929',
      },
      statusBar: {
        position: 'absolute',
        top: 0,
        left: 0,
        right: 0,
        height: '48px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        padding: '0 26px',
        fontSize: '13px',
        fontWeight: '800',
        zIndex: 30,
        pointerEvents: 'none',
        color: '#FCD34D',
      },
      dynamicIsland: {
        position: 'absolute',
        top: '10px',
        left: '50%',
        transform: 'translateX(-50%)',
        width: '108px',
        height: '28px',
        background: '#0B101D',
        borderRadius: '999px',
        zIndex: 40,
        border: '1px solid rgba(255,255,255,0.08)',
      },
      content: {
        position: 'absolute',
        top: '48px',
        left: 0,
        right: 0,
        bottom: '24px',
        overflowY: 'auto',
        overflowX: 'hidden',
        background: '#121929',
      },
      homeIndicator: {
        position: 'absolute',
        bottom: '8px',
        left: '50%',
        transform: 'translateX(-50%)',
        width: '120px',
        height: '4px',
        background: '#475569',
        borderRadius: '999px',
        zIndex: 50,
      }
    };

    function IosPhoneFrame({ children, time = "07:42" }) {
      return (
        <div style={iosFrameStyles.wrapper}>
          <div style={iosFrameStyles.screen}>
            <div style={iosFrameStyles.dynamicIsland}></div>
            <div style={iosFrameStyles.statusBar}>
              <span>{time}</span>
              <div style={{ display: 'flex', gap: '5px', alignItems: 'center' }}>
                <span style={{ fontSize: '11px', color: '#9BE0CC' }}>5G</span>
                <span style={{ fontSize: '11px' }}>100%</span>
              </div>
            </div>
            <div style={iosFrameStyles.content}>
              {children}
            </div>
            <div style={iosFrameStyles.homeIndicator}></div>
          </div>
        </div>
      );
    }

    // Direction C: Family Bento & Gentle Care
    function FamilyBentoApp({ initialTab = 'family' }) {
      const [activeTab, setActiveTab] = useState(initialTab);
      const [activeKid, setActiveKid] = useState('Ethan');
      const [showLeaveSheet, setShowLeaveSheet] = useState(false);
      const [leaveRecorded, setLeaveRecorded] = useState(false);

      const isEthan = activeKid === 'Ethan';

      return (
        <div className="flex flex-col h-full bg-[#121929] text-slate-100 font-sans relative">
          
          {/* Gentle Header */}
          <div className="px-5 pt-3 pb-3 bg-[#172136] border-b border-slate-800/80 sticky top-0 z-20">
            <div className="flex justify-between items-center">
              <div>
                <span className="text-[11px] font-extrabold text-[#FCD34D] tracking-wider uppercase">Good Morning, Sarah</span>
                <h1 className="text-base font-black text-white">Family Commute Hub</h1>
              </div>
              <div className="w-8 h-8 rounded-full bg-[#202C48] border border-amber-400/30 flex items-center justify-center text-xs font-bold text-amber-300">
                S
              </div>
            </div>
          </div>

          {/* Main Body */}
          <div className="flex-1 p-3.5 space-y-3 overflow-y-auto">

            {/* TAB 1: FAMILY BENTO BOARD */}
            {activeTab === 'family' && (
              <div className="space-y-3 animate-fade-in">

                {/* Calming Narrative Banner */}
                <div className="p-4 rounded-3xl bg-gradient-to-br from-[#1C2844] to-[#161F33] border border-slate-700/60 shadow-lg">
                  <div className="flex items-center gap-2 mb-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-[#9BE0CC] animate-pulse"></span>
                    <span className="text-[10px] font-bold text-[#9BE0CC] uppercase tracking-wider">Morning Commute Safe</span>
                  </div>
                  <div className="text-lg font-black text-white leading-snug">
                    {isEthan 
                      ? "Ethan's bus is 3 minutes away. Calm and on schedule." 
                      : "Emma's run departs in 14 minutes. No rush."}
                  </div>
                  <div className="mt-2 text-xs text-slate-300">
                    {isEthan ? "Stop: 142 Elmwood Ave · Bus #42" : "Stop: Maple Woods Community · Bus #18"}
                  </div>
                </div>

                {/* Multi-Kid Bento Switcher */}
                <div className="grid grid-cols-2 gap-2.5">
                  <button 
                    onClick={() => setActiveKid('Ethan')}
                    className={`p-3.5 rounded-2xl border text-left transition ${isEthan ? 'bg-[#202C48] border-amber-400/80 shadow-md' : 'bg-[#172136] border-slate-800 opacity-70'}`}>
                    <div className="flex justify-between items-center mb-1">
                      <span className="w-6 h-6 rounded-full bg-blue-500/20 text-blue-400 text-xs font-bold flex items-center justify-center">E</span>
                      <span className="text-[9px] font-bold text-[#9BE0CC] bg-[#9BE0CC]/15 px-1.5 py-0.5 rounded">Boarded</span>
                    </div>
                    <div className="text-sm font-black text-white">Ethan</div>
                    <div className="text-[10px] text-slate-300 mt-0.5">Grade 4 · Bus 42</div>
                  </button>

                  <button 
                    onClick={() => setActiveKid('Emma')}
                    className={`p-3.5 rounded-2xl border text-left transition ${!isEthan ? 'bg-[#202C48] border-amber-400/80 shadow-md' : 'bg-[#172136] border-slate-800 opacity-70'}`}>
                    <div className="flex justify-between items-center mb-1">
                      <span className="w-6 h-6 rounded-full bg-pink-500/20 text-pink-400 text-xs font-bold flex items-center justify-center">M</span>
                      <span className="text-[9px] font-bold text-amber-300 bg-amber-400/15 px-1.5 py-0.5 rounded">En Route</span>
                    </div>
                    <div className="text-sm font-black text-white">Emma</div>
                    <div className="text-[10px] text-slate-300 mt-0.5">Grade 2 · Bus 18</div>
                  </button>
                </div>

                {/* 2x2 Bento Box Spec */}
                <div className="grid grid-cols-2 gap-2.5">
                  <div className="bg-[#172136] p-3.5 rounded-2xl border border-slate-800">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Estimated Arrival</span>
                    <div className="text-2xl font-black text-amber-300 mt-1">3 mins</div>
                    <div className="text-[10px] text-[#9BE0CC] mt-0.5">07:44 AM On Time</div>
                  </div>

                  <div className="bg-[#172136] p-3.5 rounded-2xl border border-slate-800">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Driver Safety</span>
                    <div className="text-sm font-black text-white mt-1">Robert M.</div>
                    <div className="text-[10px] text-slate-400 mt-0.5">5★ CDL Gold Driver</div>
                  </div>
                </div>

                {/* Map Preview & Safe Path */}
                <div className="bg-[#172136] rounded-2xl p-3 border border-slate-800 space-y-2">
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-bold text-slate-300">Live Escort Path</span>
                    <span className="text-[10px] text-slate-400">500m Safe Radius</span>
                  </div>
                  <div className="h-28 rounded-xl bg-[#0F1626] border border-slate-800 relative overflow-hidden flex items-center justify-center">
                    <svg className="w-full h-full">
                      <circle cx="80" cy="56" r="36" fill="#FCD34D" fillOpacity="0.08" stroke="#FCD34D" strokeDasharray="3 3" />
                      <circle cx="80" cy="56" r="6" fill="#FCD34D" />
                      <path d="M 280 90 Q 180 30 80 56" fill="none" stroke="#9BE0CC" strokeWidth="4" strokeLinecap="round" />
                    </svg>
                    <div className="absolute left-16 top-6 px-2 py-0.5 rounded-full bg-amber-400 text-slate-950 text-[9px] font-black shadow">
                      📍 Elmwood
                    </div>
                    <div className="absolute right-12 bottom-4 px-2 py-0.5 rounded-full bg-[#9BE0CC] text-slate-950 text-[9px] font-black shadow">
                      🚌 Bus #42
                    </div>
                  </div>
                </div>

                {/* 1-Tap Absence Button */}
                <button 
                  onClick={() => setShowLeaveSheet(true)}
                  className="w-full py-3 bg-[#FCD34D] hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow-md transition">
                  Report Absence / Leave Request
                </button>
              </div>
            )}

            {/* TAB 2: SCHEDULE */}
            {activeTab === 'schedule' && (
              <div className="space-y-3 animate-fade-in">
                <div className="bg-[#172136] rounded-2xl p-4 border border-slate-800 space-y-3">
                  <div className="text-sm font-black text-white">Daily Commute Schedule</div>
                  
                  <div className="space-y-2 text-xs">
                    <div className="p-3 rounded-xl bg-[#202C48] border border-slate-700/80 flex justify-between items-center">
                      <div>
                        <div className="font-bold text-amber-300">Morning Pickup (AM)</div>
                        <div className="text-[10px] text-slate-400">07:44 AM · 142 Elmwood Ave</div>
                      </div>
                      <span className="text-[10px] font-bold text-[#9BE0CC] bg-[#9BE0CC]/15 px-2 py-0.5 rounded">Active</span>
                    </div>

                    <div className="p-3 rounded-xl bg-[#1A243B] border border-slate-800 flex justify-between items-center">
                      <div>
                        <div className="font-bold text-slate-200">Afternoon Return (PM)</div>
                        <div className="text-[10px] text-slate-400">03:22 PM · 142 Elmwood Ave</div>
                      </div>
                      <span className="text-[10px] text-slate-500">Upcoming</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: CONTACTS */}
            {activeTab === 'contacts' && (
              <div className="space-y-3 animate-fade-in">
                <div className="bg-[#172136] rounded-2xl p-4 border border-slate-800 space-y-3">
                  <div className="text-sm font-black text-white">Emergency Support Contacts</div>
                  
                  <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 flex justify-between items-center">
                    <div>
                      <div className="font-bold text-xs text-rose-300">24/7 Dispatch Desk</div>
                      <div className="text-[10px] text-slate-400">Immediate route resolution</div>
                    </div>
                    <a href="tel:6135550100" className="px-3 py-1 bg-rose-600 text-white rounded-lg text-xs font-bold">
                      Call
                    </a>
                  </div>

                  <div className="p-3 rounded-xl bg-[#202C48] border border-slate-700 flex justify-between items-center">
                    <div>
                      <div className="font-bold text-xs text-slate-200">Child Welfare Hotline</div>
                      <div className="text-[10px] text-slate-400">Student safety officer</div>
                    </div>
                    <a href="tel:6135550199" className="px-3 py-1 bg-slate-700 text-white rounded-lg text-xs font-bold">
                      Call
                    </a>
                  </div>
                </div>
              </div>
            )}

          </div>

          {/* Absence Sheet */}
          {showLeaveSheet && (
            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end">
              <div className="w-full bg-[#172136] border-t border-slate-800 rounded-t-3xl p-5 space-y-4">
                <div className="w-10 h-1 bg-slate-700 rounded-full mx-auto"></div>
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-black text-white">Report Absence · {activeKid}</h3>
                  <button onClick={() => setShowLeaveSheet(false)} className="text-slate-400 font-bold text-lg">×</button>
                </div>
                {leaveRecorded ? (
                  <div className="py-4 text-center space-y-2">
                    <div className="text-2xl text-[#9BE0CC]">✓</div>
                    <div className="text-xs font-bold text-white">Dispatch & Driver Notified</div>
                    <button onClick={() => { setShowLeaveSheet(false); setLeaveRecorded(false); }} className="mt-2 px-4 py-1.5 bg-slate-800 text-white rounded-lg text-xs">Done</button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="text-xs text-slate-400">Please select reason:</div>
                    <div className="grid grid-cols-1 gap-1.5 text-xs">
                      {['Sick / Fever', 'Dental / Health Checkup', 'Family Vacation / Personal'].map(r => (
                        <div key={r} className="p-2.5 rounded-xl bg-[#202C48] border border-slate-700 text-slate-200">{r}</div>
                      ))}
                    </div>
                    <button 
                      onClick={() => setLeaveRecorded(true)}
                      className="w-full py-2.5 bg-[#FCD34D] text-slate-950 font-black rounded-xl text-xs">
                      Submit Absence to Dispatch
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Bottom Tabs */}
          <div className="bg-[#172136] border-t border-slate-800/80 py-2 px-6 flex justify-around text-[10px] font-bold text-slate-400">
            <button 
              onClick={() => setActiveTab('family')}
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'family' ? 'text-amber-300 font-black' : 'hover:text-white'}`}>
              <span className="text-sm">🏠</span>
              <span>Bento</span>
            </button>
            <button 
              onClick={() => setActiveTab('schedule')}
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'schedule' ? 'text-amber-300 font-black' : 'hover:text-white'}`}>
              <span className="text-sm">📅</span>
              <span>Schedule</span>
            </button>
            <button 
              onClick={() => setActiveTab('contacts')}
              className={`flex flex-col items-center gap-0.5 ${activeTab === 'contacts' ? 'text-amber-300 font-black' : 'hover:text-white'}`}>
              <span className="text-sm">📞</span>
              <span>Support</span>
            </button>
          </div>

        </div>
      );
    }

    // Direction C Showcase Board
    function DirectionCShowcase() {
      return (
        <div className="max-w-7xl mx-auto space-y-8">
          
          <div className="bg-[#172136] p-6 rounded-3xl border border-slate-800 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="px-3 py-0.5 text-xs font-bold rounded-full bg-amber-400 text-slate-950">方向 C · 秒数轮盘 (S=58)</span>
                <span className="text-xs font-semibold text-slate-400">Gentler Streak 亲和家庭守护</span>
              </div>
              <h1 className="text-2xl md:text-3xl font-extrabold text-white tracking-tight">暖心守护 · 便当盒架构 (Calm Family Bento)</h1>
              <p className="text-xs md:text-sm text-slate-400 mt-1 max-w-2xl">
                28px 圆角便当盒卡片、深海蓝底+柔和粉彩、情绪安抚文案，专为减缓多子女早高峰焦虑设计。每台手机均可真实交互测试！
              </p>
            </div>
            <div className="flex gap-2">
              <span className="px-3 py-1.5 rounded-xl bg-[#202C48] text-slate-300 font-bold text-xs">深海蓝 #121929</span>
              <span className="px-3 py-1.5 rounded-xl bg-amber-400/20 text-amber-300 font-bold text-xs border border-amber-400/30">安心暖黄 #FCD34D</span>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-8 justify-items-center">
            
            <div className="flex flex-col items-center">
              <div className="text-xs font-bold text-slate-400 mb-2 flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                <span>Screen 1: 多子女便当盒总览</span>
              </div>
              <IosPhoneFrame time="07:41">
                <FamilyBentoApp initialTab="family" />
              </IosPhoneFrame>
            </div>

            <div className="flex flex-col items-center">
              <div className="text-xs font-bold text-slate-400 mb-2 flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span>Screen 2: 每日接驳日程规划</span>
              </div>
              <IosPhoneFrame time="07:44">
                <FamilyBentoApp initialTab="schedule" />
              </IosPhoneFrame>
            </div>

            <div className="flex flex-col items-center">
              <div className="text-xs font-bold text-slate-400 mb-2 flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-blue-400"></span>
                <span>Screen 3: 极速 1-Tap 请假报备</span>
              </div>
              <IosPhoneFrame time="07:45">
                <FamilyBentoApp initialTab="family" />
              </IosPhoneFrame>
            </div>

            <div className="flex flex-col items-center">
              <div className="text-xs font-bold text-slate-400 mb-2 flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-rose-400"></span>
                <span>Screen 4: 紧急联系与调度中心</span>
              </div>
              <IosPhoneFrame time="07:46">
                <FamilyBentoApp initialTab="contacts" />
              </IosPhoneFrame>
            </div>

          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DirectionCShowcase />);
  </script>
</body>
</html>
