<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direction B: Apple HIG Modern Glass · PCY Driver App</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=SF+Pro+Display:wght@500;600;700;800&display=swap');
    body {
      background: #F1F5F9;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
    }
    .glass-card-subtle {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen py-10 px-6">
  <div class="max-w-[1720px] mx-auto">
    <!-- Header Banner -->
    <header class="mb-8 flex flex-col md:flex-row md:items-end justify-between border-b border-slate-300 pb-6 gap-4">
      <div>
        <div class="flex items-center gap-2.5 mb-2">
          <span class="px-2.5 py-0.5 rounded text-[11px] font-black tracking-wider bg-slate-900 text-white uppercase">Direction B</span>
          <span class="text-xs font-bold text-amber-600">APPLE HIG GLASS // NATIVE POLISH</span>
          <span class="px-2 py-0.5 rounded text-[10px] bg-white text-slate-700 shadow-sm border border-slate-200">现代人机工程 · 流体毛玻璃 · 亲和层级</span>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">现代移动原生精修 · Apple HIG 规范方案</h1>
        <p class="text-slate-600 text-sm mt-1 max-w-2xl">
          遵循 Apple 最高标准人机交互指南。明亮通透的微磨砂底卡、校车标志性铬黄色强调、灵动岛避让、圆润胶囊标签（Pill tags）与细腻层级投影，带来极高的亲和力与愉悦的日常使用体验。
        </p>
      </div>
      <div class="flex items-center gap-3">
        <a href="Direction-A-Cockpit-HUD.html" class="px-4 py-2 bg-white hover:bg-slate-50 text-slate-800 text-xs font-bold rounded-lg border border-slate-300 transition-colors">← 查看方向 A</a>
        <a href="Direction-C-Mission-Sheet.html" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-lg transition-colors">查看方向 C →</a>
      </div>
    </header>

    <div id="root"></div>
  </div>

  <script type="text/babel">
    const { useState } = React;

    // --- Standard IosFrame (Light Mode) ---
    const iosFrameStyles = {
      wrapper: {
        display: 'inline-block',
        padding: 12,
        background: '#FFFFFF',
        borderRadius: 56,
        boxShadow: '0 0 0 2px #CBD5E1, 0 25px 60px -15px rgba(15, 23, 42, 0.15)',
        position: 'relative',
      },
      screen: {
        position: 'relative',
        borderRadius: 44,
        overflow: 'hidden',
        background: '#F8FAFC',
      },
      statusBar: {
        position: 'absolute',
        top: 0,
        left: 0,
        right: 0,
        height: 50,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        padding: '0 28px',
        fontSize: 14,
        fontWeight: 600,
        color: '#0F172A',
        zIndex: 20,
        pointerEvents: 'none',
      },
      dynamicIsland: {
        position: 'absolute',
        top: 10,
        left: '50%',
        transform: 'translateX(-50%)',
        width: 120,
        height: 32,
        background: '#000',
        borderRadius: 999,
        zIndex: 30,
      },
      content: {
        position: 'absolute',
        top: 50,
        left: 0,
        right: 0,
        bottom: 24,
        overflowY: 'auto',
      },
      homeIndicator: {
        position: 'absolute',
        bottom: 8,
        left: '50%',
        transform: 'translateX(-50%)',
        width: 130,
        height: 4,
        background: 'rgba(0,0,0,0.3)',
        borderRadius: 999,
        zIndex: 10,
      },
    };

    function IosFrame({ children, width = 375, height = 780, time = '9:41', battery = 92 }) {
      return (
        <div style={iosFrameStyles.wrapper}>
          <div style={{ ...iosFrameStyles.screen, width, height }}>
            <div style={iosFrameStyles.statusBar}>
              <span>{time}</span>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span className="text-[11px] font-semibold text-slate-700">5G</span>
                <span className="text-[11px] font-bold text-slate-900">{battery}%</span>
              </div>
            </div>
            <div style={iosFrameStyles.dynamicIsland} />
            <div style={iosFrameStyles.content}>{children}</div>
            <div style={iosFrameStyles.homeIndicator} />
          </div>
        </div>
      );
    }

    const mockTrip = {
      title: "Science Museum Field Trip",
      tripNumber: "CT-204",
      client: "St. Patrick High School",
      busNumber: "102",
      plateNumber: "ON-BUS-889",
      driverRate: 150.00,
      eiHours: 5.0,
      checkedIn: true,
      checkInTime: "07:38",
      stops: [
        { id: 1, type: "Pickup", label: "School Pickup", addr: "450 Maple Ave", time: "08:00 AM", done: true },
        { id: 2, type: "Dropoff", label: "Museum Dropoff", addr: "Ontario Science Centre", time: "08:30 AM", current: true },
        { id: 3, type: "Return Pickup", label: "Afternoon Return", addr: "Ontario Science Centre", time: "15:00 PM" },
        { id: 4, type: "Return Dropoff", label: "School Arrival", addr: "450 Maple Ave", time: "15:30 PM" }
      ]
    };

    // --- Screen 1: Modern HIG Shift Dashboard ---
    function HigShiftScreen({ trip, onCheckInToggle }) {
      return (
        <div className="p-4 flex flex-col h-full justify-between bg-gradient-to-b from-amber-50/40 via-slate-50 to-slate-100">
          <div>
            {/* Top Driver Header Profile Badge */}
            <div className="flex items-center justify-between mb-4 pt-1">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-full bg-amber-500 text-black font-extrabold flex items-center justify-center text-sm shadow-sm">
                  MD
                </div>
                <div>
                  <div className="text-sm font-bold text-slate-900">Mason Driver</div>
                  <div className="text-xs text-slate-500">Bus Operator · Seniority #4</div>
                </div>
              </div>
              <span className="px-3 py-1 bg-amber-500/20 text-amber-800 text-xs font-bold rounded-full border border-amber-500/30">
                Bus #102
              </span>
            </div>

            {/* Main Charter Card */}
            <div className="glass-card rounded-3xl p-5 mb-4">
              <div className="flex items-center justify-between mb-2">
                <span className="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-500 text-black uppercase tracking-wider">
                  CHARTER TRIP
                </span>
                <span className="text-xs font-bold text-slate-400">#CT-204</span>
              </div>
              <h2 className="text-xl font-extrabold text-slate-900 leading-tight">{trip.title}</h2>
              <div className="text-xs text-slate-500 mt-1">{trip.client}</div>

              {/* Time pill info */}
              <div className="mt-4 grid grid-cols-2 gap-2 bg-slate-100/70 p-3 rounded-2xl">
                <div>
                  <span className="text-[10px] font-bold text-slate-400 uppercase">DEPARTS</span>
                  <div className="text-base font-extrabold text-slate-800">08:00 AM</div>
                </div>
                <div>
                  <span className="text-[10px] font-bold text-slate-400 uppercase">RETURNS</span>
                  <div className="text-base font-extrabold text-slate-800">15:30 PM</div>
                </div>
              </div>

              {/* Verified Rate Callout */}
              <div className="mt-3.5 p-3.5 bg-emerald-50 border border-emerald-200/80 rounded-2xl flex items-center justify-between">
                <div>
                  <div className="text-[10px] font-extrabold text-emerald-800 uppercase tracking-wider">CONFIRMED RATE</div>
                  <div className="text-2xl font-extrabold text-emerald-600">${trip.driverRate.toFixed(2)}</div>
                </div>
                <div className="text-right">
                  <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded-full">
                    {trip.eiHours}h EI
                  </span>
                  <div className="text-[11px] text-emerald-700 font-medium mt-1">✓ Logged to Payroll</div>
                </div>
              </div>
            </div>

            {/* Pre-Trip Inspection Status Card */}
            <div className="glass-card-subtle rounded-2xl p-3.5 flex items-center justify-between text-xs">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">
                  ✓
                </div>
                <div>
                  <div className="font-bold text-slate-800">Schedule 5 Pre-Trip Pass</div>
                  <div className="text-[11px] text-slate-500">Bus #102 · Sign-off 07:35 AM</div>
                </div>
              </div>
              <span className="text-slate-400 font-semibold text-[11px]">View ↗</span>
            </div>
          </div>

          {/* Action button */}
          <div className="pt-3">
            <button
              onClick={onCheckInToggle}
              className={`w-full py-4 rounded-2xl font-bold text-sm shadow-md transition-all active:scale-[0.98] ${
                trip.checkedIn 
                  ? 'bg-slate-900 text-white' 
                  : 'bg-amber-500 hover:bg-amber-400 text-black'
              }`}
            >
              {trip.checkedIn ? `✓ Checked In (${trip.checkInTime})` : 'Confirm Check-In'}
            </button>
          </div>
        </div>
      );
    }

    // --- Screen 2: Modern HIG 4-Stop Schedule ---
    function HigStopsScreen({ trip }) {
      return (
        <div className="p-4 flex flex-col h-full justify-between bg-slate-50">
          <div>
            <div className="flex items-center justify-between mb-4">
              <div>
                <span className="text-[11px] font-bold text-amber-600 uppercase tracking-wider">ITINERARY</span>
                <h2 className="text-xl font-extrabold text-slate-900">4-Stop Schedule</h2>
              </div>
              <span className="px-3 py-1 bg-white text-slate-700 text-xs font-bold rounded-full shadow-sm border border-slate-200">
                1/4 Done
              </span>
            </div>

            {/* Prominent Current Stop Bubble */}
            <div className="glass-card rounded-3xl p-5 mb-4 border-l-4 border-l-amber-500">
              <div className="flex items-center justify-between mb-1">
                <span className="text-[10px] font-extrabold text-amber-600 uppercase">NEXT STOP (#2)</span>
                <span className="text-xs font-extrabold text-slate-700">08:30 AM</span>
              </div>
              <div className="text-lg font-extrabold text-slate-900">Museum Dropoff</div>
              <div className="text-xs text-slate-500 mt-0.5">Ontario Science Centre</div>
              
              <div className="mt-4 flex gap-2">
                <button className="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold rounded-xl shadow-sm flex items-center justify-center gap-1.5">
                  <span>🧭</span> Start Navigation
                </button>
                <button className="px-3 py-2.5 bg-white text-slate-700 text-xs font-bold rounded-xl border border-slate-200 shadow-sm">
                  Passenger List (45)
                </button>
              </div>
            </div>

            {/* List of remaining stops */}
            <div className="space-y-2.5">
              {trip.stops.map((st, i) => (
                <div key={st.id} className={`p-3.5 rounded-2xl border transition-all ${
                  st.done 
                    ? 'bg-slate-100 border-slate-200 opacity-60' 
                    : st.current 
                    ? 'bg-white border-amber-500/50 shadow-sm' 
                    : 'bg-white border-slate-200/80 shadow-xs'
                }`}>
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${
                        st.done ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-700'
                      }`}>
                        {st.done ? '✓' : i + 1}
                      </div>
                      <div>
                        <div className="text-xs font-bold text-slate-900">{st.label}</div>
                        <div className="text-[11px] text-slate-500">{st.addr}</div>
                      </div>
                    </div>
                    <span className="text-xs font-extrabold text-slate-700">{st.time}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="pt-3">
            <button className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-sm rounded-2xl shadow-md active:scale-[0.98]">
              Confirm Arrival at Museum
            </button>
          </div>
        </div>
      );
    }

    // --- Screen 3: HIG Pre-Trip Checklist ---
    function HigPreTripScreen() {
      const checks = [
        "Brakes & Air Pressure Test",
        "Emergency Roof Hatches & Doors",
        "Exterior Lights & Crossing Arm",
        "Tires, Rims & Lug Nut Inspection",
        "Driver Mirrors & Clean Glass",
        "First Aid Kit & Fire Extinguisher"
      ];

      return (
        <div className="p-4 flex flex-col h-full justify-between bg-slate-50">
          <div>
            <div className="flex items-center justify-between mb-4">
              <div>
                <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">COMPLIANCE</span>
                <h2 className="text-xl font-extrabold text-slate-900">Pre-Trip Inspection</h2>
              </div>
              <span className="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">
                All Passed
              </span>
            </div>

            <div className="glass-card rounded-2xl p-4 mb-4 flex items-center justify-between">
              <div>
                <div className="text-xs text-slate-500 font-medium">Odometer Check</div>
                <div className="text-xl font-extrabold text-slate-900 mt-0.5">142,850 KM</div>
              </div>
              <button className="px-3 py-1.5 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl">Update</button>
            </div>

            <div className="space-y-2">
              {checks.map((c, i) => (
                <div key={i} className="p-3 bg-white border border-slate-200 rounded-2xl flex items-center justify-between shadow-xs">
                  <span className="text-xs font-semibold text-slate-800">{c}</span>
                  <div className="w-6 h-6 rounded-lg bg-emerald-500 text-white flex items-center justify-center text-xs font-bold">
                    ✓
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="pt-3">
            <button className="w-full py-4 bg-slate-900 text-white font-bold text-sm rounded-2xl shadow-md">
              Complete Pre-Trip Sign-Off
            </button>
          </div>
        </div>
      );
    }

    // --- Screen 4: HIG Route Openings ---
    function HigOpeningsScreen() {
      return (
        <div className="p-4 flex flex-col h-full justify-between bg-slate-50">
          <div>
            <div className="flex items-center justify-between mb-4">
              <div>
                <span className="text-[11px] font-bold text-amber-600 uppercase tracking-wider">MARKETPLACE</span>
                <h2 className="text-xl font-extrabold text-slate-900">Route Openings</h2>
              </div>
              <span className="text-xs font-bold text-slate-500">2 Available</span>
            </div>

            <div className="space-y-3">
              {/* Charter Card */}
              <div className="glass-card rounded-3xl p-4.5 border-l-4 border-l-amber-500">
                <div className="flex justify-between items-center mb-1.5">
                  <span className="px-2.5 py-0.5 bg-amber-100 text-amber-800 text-[10px] font-extrabold rounded-full">
                    CHARTER TRIP
                  </span>
                  <span className="text-sm font-extrabold text-emerald-600">$160.00 Rate</span>
                </div>
                <div className="text-base font-extrabold text-slate-900">Athletic Tournament Convoi</div>
                <div className="text-xs text-slate-500 mt-0.5">Tomorrow · 09:00 - 16:30 (4 Stops)</div>
                <div className="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
                  <span className="text-xs text-slate-500">Bus #108 Assigned</span>
                  <button className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs rounded-xl shadow-xs">
                    Claim Shift
                  </button>
                </div>
              </div>

              {/* Regular Card */}
              <div className="glass-card rounded-3xl p-4.5">
                <div className="flex justify-between items-center mb-1.5">
                  <span className="px-2.5 py-0.5 bg-slate-100 text-slate-700 text-[10px] font-bold rounded-full">
                    DAILY PM ROUTE
                  </span>
                  <span className="text-sm font-bold text-slate-900">$65.00 Flat</span>
                </div>
                <div className="text-base font-bold text-slate-900">Route 22P Cover Shift</div>
                <div className="text-xs text-slate-500 mt-0.5">Today · 14:45 - 16:30</div>
                <div className="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
                  <span className="text-xs text-slate-500">Bus #112</span>
                  <button className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs rounded-xl">
                    Submit Bid
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div className="pt-3 text-center text-xs text-slate-400">
            Swipe down to refresh openings
          </div>
        </div>
      );
    }

    function App() {
      const [trip, setTrip] = useState(mockTrip);

      const toggleCheckIn = () => {
        setTrip(t => ({
          ...t,
          checkedIn: !t.checkedIn,
          checkInTime: !t.checkedIn ? "09:41" : null
        }));
      };

      return (
        <div>
          <div className="flex flex-wrap gap-8 justify-center items-start py-6">
            
            {/* Screen 1 */}
            <div className="flex flex-col items-center">
              <div className="mb-3 text-center">
                <span className="text-xs font-bold text-slate-500 tracking-wider uppercase">01 / SHIFT & CHECK-IN</span>
                <div className="text-sm font-bold text-slate-900">班次主卡与 Payroll Rate 透视</div>
              </div>
              <IosFrame time="9:41" battery={92}>
                <HigShiftScreen trip={trip} onCheckInToggle={toggleCheckIn} />
              </IosFrame>
            </div>

            {/* Screen 2 */}
            <div className="flex flex-col items-center">
              <div className="mb-3 text-center">
                <span className="text-xs font-bold text-amber-600 tracking-wider uppercase">02 / 4-STOP ITINERARY</span>
                <div className="text-sm font-bold text-slate-900">四站往返时刻与到站打卡</div>
              </div>
              <IosFrame time="9:42" battery={91}>
                <HigStopsScreen trip={trip} />
              </IosFrame>
            </div>

            {/* Screen 3 */}
            <div className="flex flex-col items-center">
              <div className="mb-3 text-center">
                <span className="text-xs font-bold text-emerald-600 tracking-wider uppercase">03 / PRE-TRIP CHECK</span>
                <div className="text-sm font-bold text-slate-900">Schedule 5 车检数字签章</div>
              </div>
              <IosFrame time="7:35" battery={98}>
                <HigPreTripScreen />
              </IosFrame>
            </div>

            {/* Screen 4 */}
            <div className="flex flex-col items-center">
              <div className="mb-3 text-center">
                <span className="text-xs font-bold text-indigo-600 tracking-wider uppercase">04 / ROUTE BIDDING</span>
                <div className="text-sm font-bold text-slate-900">空缺包车与临时增援申领</div>
              </div>
              <IosFrame time="10:15" battery={85}>
                <HigOpeningsScreen />
              </IosFrame>
            </div>

          </div>

          <footer className="mt-12 p-6 bg-white border border-slate-200 rounded-2xl max-w-4xl mx-auto text-xs text-slate-500 space-y-2 shadow-sm">
            <div className="font-bold text-slate-900 uppercase text-sm mb-1">方向 B · Apple HIG 原生精修设计说明 (Design Notes)</div>
            <p>1. <strong>毛玻璃与层次感</strong>：多层 `backdrop-filter: blur(20px)` 创造通透的视觉景深，将校车工作系统提升至精品消费级 App 水准。</p>
            <p>2. <strong>亲和暖调</strong>：融合经典的校车铭黄色作为焦点交互色，搭配深石板灰与翡翠绿，信息层次极为清晰舒适。</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
